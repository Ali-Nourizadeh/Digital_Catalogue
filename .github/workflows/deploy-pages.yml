name: Deploy to GitHub Pages

# The site is plain static files, so there is no build step. The repository
# root is uploaded as is.
#
# HEADS UP: a repository has ONE GitHub Pages site, and the Behkooshan branch
# carries this same workflow pointed at itself. Both branches therefore
# publish to the same URL and whichever one deployed last is what is live.
# That is fine while this branch is the one being worked on, and it is why
# the trigger below names only this branch: pushing to Behkooshan will still
# replace the site, so decide which branch owns the URL rather than pushing
# to both and wondering what happened.
#
# To stop this branch publishing automatically, delete the `push:` block and
# leave `workflow_dispatch:`; the branch can then still be published by hand
# from the Actions tab.
on:
  push:
    branches: [Behkooshan-catalogue]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it, so the published
# site is never left half written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
